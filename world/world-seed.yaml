- id: activation-hooks
  title: Catching activations
  region: interp-engineering
  theme: "Capturing activations"
  p: 3
  size: S
  prompt: >-
    Capture residual-stream activations from GPT-2 small with forward hooks, without
    TransformerLens first and then with it.
