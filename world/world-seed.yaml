# Stratum: seed world
# ----------------------------------------------------------------------------
# The starter world for Stratum. It is written by hand, and it is meant to be
# pruned, reworded and extended. DESIGN.md §4 has the schema and §6 has the
# visibility rules that use `p` (prominence).
#
# Shrine fields:
#   id        unique kebab-case slug (also the work folder name)
#   title     short name shown on the map
#   region    region id (the region decides the layer)
#   kind      shrine (default) | tower | temple
#   p         prominence 1..5 (default 2). Towers and temples are 5.
#             High-p shrines "peek over ridges" (the triangle rule).
#   size      S (2-3h) | M (4-6h, default) | L (8-12h)
#   requires  optional hardware/tool tags: gpu, arm, x86, avx512, linux, llm-api
#   below     (depths only) id of the surface shrine this wellspring sits under
#   theme     (surface/sky shrines) named sub-area of the region; shrines sharing a theme cluster together
#   after     optional ids this shrine follows up on; placed next to its predecessor when in the same region
#   links     optional ids across layers (chasms / launch points), or other related ids
#   needs     shrine ids that must be cleared first: a temple is sealed until then, a shrine is locked
#             (you can see and read it, not start it). Use only where it works on that shrine's artefact.
#   prompt    what to build
#   done      the clear condition, beyond the standard write-up (DESIGN.md §5)
#
# Starter kits: world/kits/<id>/ is copied into work/<id>/ on `stratum start`, replacing the code template,
# when a shrine needs material to work on and no earlier shrine provides it (docs/plans/self-contained.md).
# ----------------------------------------------------------------------------

canvas: { width: 1600, height: 1000 }

start:
  sky:                           # you begin on this island, looking down; clearing one of these is the descent (§6.6)
    - design-zero-cost
  vantage: [800, 500]            # where you land, the "plateau": the cpp-core centroid
  plateau:                       # revealed once you land
    - tower-cpp-core
    - cmake-modern
    - benchmark-methodology
    - value-categories

regions:
  # --- SURFACE ----------------------------------------------------------------
  - { id: cpp-core,            layer: surface, name: "The Core Plateau",        centroid: [800, 500], biome: plateau }
  - { id: metaprogramming,     layer: surface, name: "Template Highlands",      centroid: [560, 300], biome: highland }
  - { id: tooling-measurement, layer: surface, name: "Instrument Ridge",        centroid: [820, 190], biome: ridge }
  - { id: concurrency,         layer: surface, name: "Atomic Steppes",          centroid: [1080, 300], biome: steppe }
  - { id: parallel-simd,       layer: surface, name: "Vector Coast",            centroid: [1310, 520], biome: coast }
  - { id: gpu-programming,     layer: surface, name: "Kernel Jungle",           centroid: [1260, 810], biome: jungle }
  - { id: interp-engineering,  layer: surface, name: "Activation Marsh",        centroid: [880, 830], biome: marsh }
  - { id: data-structures,     layer: surface, name: "Cacheline Woods",         centroid: [520, 660], biome: woods }
  - { id: low-latency,         layer: surface, name: "Tick Canyon",             centroid: [250, 420], biome: canyon }
  - { id: agent-harness,       layer: surface, name: "Agent Workshops",         centroid: [320, 830], biome: workshop }
  # --- SKY (islands float above related surface regions) ------------------------
  - { id: agentic-forge,       layer: sky, name: "The Agentic Forge",       centroid: [330, 760],  radius: 170 }
  - { id: design-archipelago,  layer: sky, name: "Design Archipelago",      centroid: [540, 420],  radius: 190 }
  - { id: interp-theory,       layer: sky, name: "Isles of Interpretation", centroid: [900, 770],  radius: 180 }
  - { id: performance-theory,  layer: sky, name: "Roofline Heights",        centroid: [1190, 380], radius: 190 }
  - { id: numerical-heights,   layer: sky, name: "Numerical Heights",       centroid: [1420, 740], radius: 140 }
  # --- DEPTHS ("veins": thematic colours; each wellspring's position is its `below` shrine's) ---
  - { id: isa-assembly,        layer: depths, name: "Vein of Instructions" }
  - { id: microarchitecture,   layer: depths, name: "Pipeline Vein" }
  - { id: memory-hierarchy,    layer: depths, name: "Cache Vein" }
  - { id: compilers,           layer: depths, name: "Compiler Vein" }
  - { id: gpu-metal,           layer: depths, name: "Silicon Vein" }
  - { id: os-kernel,           layer: depths, name: "Kernel-space Vein" }
  - { id: numerics-bits,       layer: depths, name: "Bit Vein" }

# Ridge heights between adjacent surface regions (default 2). An override for
# two regions that don't share a border is ignored, and the loader warns about it.
ridges:
  default: 2
  overrides:
    - { between: [cpp-core, metaprogramming], h: 1 }
    - { between: [cpp-core, data-structures], h: 1 }
    - { between: [cpp-core, tooling-measurement], h: 1 }
    - { between: [gpu-programming, parallel-simd], h: 1 }
    - { between: [gpu-programming, interp-engineering], h: 1 }
    - { between: [concurrency, parallel-simd], h: 3 }
    - { between: [tooling-measurement, concurrency], h: 3 }
    - { between: [low-latency, agent-harness], h: 4 }
    - { between: [low-latency, metaprogramming], h: 3 }

shrines:

# =============================================================================
# SURFACE
# =============================================================================

# ---- The Core Plateau (cpp-core) ---------------------------------------------
- id: tower-cpp-core
  title: "Tower: the Core Plateau"
  region: cpp-core
  kind: tower
  size: S
  prompt: >-
    Survey modern C++ (17/20/23/26) through a performance lens. Which features change
    codegen, which change only ergonomics, and which are traps on a hot path?
  done: >-
    A one-page region survey plus at least 3 proposed new shrines (added to world/proposed.yaml).

- id: value-categories
  title: Value categories, witnessed
  region: cpp-core
  theme: "Ownership & lifetimes"
  p: 3
  size: S
  prompt: >-
    Write a `Noisy` type that logs every constructor, assignment and destructor. Write 12
    expressions (returns, std::move, ternaries, braced init, function args) and predict
    which special members fire before running them.
  done: >-
    A prediction-vs-actual table, with each miss explained in terms of lvalue/xvalue/prvalue
    and C++17 guaranteed copy elision.

- id: move-semantics-vector
  title: A vector that moves correctly
  region: cpp-core
  theme: "Ownership & lifetimes"
  p: 3
  after: [value-categories]
  prompt: >-
    Implement a minimal `vector<T>` (push_back, emplace_back, reserve) with the strong
    exception guarantee, using std::move_if_noexcept during reallocation.
  done: >-
    A test showing that a type with a throwing move constructor gets copied on reallocation, and a
    benchmark of noexcept vs non-noexcept element types.

- id: raii-handles
  title: RAII for everything
  region: cpp-core
  theme: "Ownership & lifetimes"
  size: S
  prompt: >-
    Write a generic `unique_handle<Traits>` that wraps file descriptors, mmap regions and
    (optionally) CUDA streams. Apply the rule of zero vs the rule of five.
  done: >-
    The wrapper holds a file descriptor and an mmap region with no leaks under ASan and macOS `leaks
    --atExit` (valgrind on Linux), and `sizeof` matches the raw handle.

- id: smart-pointer-costs
  title: What shared_ptr really costs
  region: cpp-core
  theme: "Ownership & lifetimes"
  after: [raii-handles]
  prompt: >-
    Implement a simplified shared_ptr with a control block, plus make_shared with a single
    allocation. Benchmark copy, move and destruction against unique_ptr and raw pointers
    in a multi-threaded workload.
  done: >-
    Benchmark results that separate the cost of the atomic refcount from the cost of the allocation.

- id: constexpr-tables
  title: Tables built by the compiler
  region: cpp-core
  theme: "What it compiles to"
  size: S
  prompt: >-
    Generate a CRC32 or 8-bit popcount lookup table at compile time with constexpr/consteval,
    and verify that it lands in .rodata with no runtime initialisation.
  done: >-
    Disassembly/objdump showing the table in .rodata and no static-init code.

- id: ranges-pipelines
  title: Ranges, lazily
  region: cpp-core
  theme: "Lazy & async"
  prompt: >-
    Rewrite a filter-transform-accumulate loop with std::ranges views. Then write a custom
    view adaptor (e.g. `stride_by` or `chunk_sum`) that composes with `|`.
  done: >-
    A codegen and timing comparison with the hand-written loop at -O2, plus a working custom adaptor.

- id: coroutines-generator
  title: A generator from scratch
  region: cpp-core
  theme: "Lazy & async"
  p: 3
  after: [ranges-pipelines]
  prompt: >-
    Implement `generator<T>` by hand (promise_type, coroutine_handle, iterator), then compare it
    with std::generator (C++23; Homebrew GCC 14+, as Apple libc++ lacks it) on a lazy tokenizer.
  done: >-
    Both versions produce identical output. The write-up traces a coroutine's lifecycle from
    initial_suspend to final_suspend.

- id: std-expected-errors
  title: Errors as values
  region: cpp-core
  theme: "Errors & contracts"
  prompt: >-
    Write the same small parser twice, once with exceptions and once with std::expected
    (C++23). Measure the happy-path and error-path costs at several error rates.
  done: >-
    A plot of time vs error rate for both versions, with the crossover explained.

- id: variant-visit
  title: Variant vs virtual
  region: cpp-core
  theme: "What it compiles to"
  prompt: >-
    Model an order-event state machine twice, once with std::variant + std::visit and once
    with a virtual hierarchy. Compare dispatch codegen and throughput.
  done: >-
    Annotated disassembly of both dispatch paths (jump table vs indirect call) and a benchmark.

- id: lambdas-closures
  title: What a lambda is
  region: cpp-core
  theme: "What it compiles to"
  size: S
  prompt: >-
    Show what lambdas compile to: closure layout, captures by value/ref, and generic lambdas.
    Compare std::function, a function_ref (C++26 or hand-rolled) and a template parameter
    as callback carriers.
  done: >-
    A sizeof table, an allocation count for std::function, and a benchmark of the three carriers.

- id: contracts-26
  title: Contracts in C++26
  region: cpp-core
  theme: "Errors & contracts"
  size: S
  after: [std-expected-errors, concepts-constraints]
  prompt: >-
    Using GCC trunk on Compiler Explorer (P2900) or a documented emulation, add pre/post conditions
    to your numeric library (Concepts as contracts shrine) and compare the evaluation semantics
    (ignore/observe/enforce).
  done: >-
    A demo of each evaluation semantic, plus the codegen difference between ignore and enforce.

# ---- Template Highlands (metaprogramming) ------------------------------------
- id: tower-metaprogramming
  title: "Tower: Template Highlands"
  region: metaprogramming
  kind: tower
  size: S
  prompt: >-
    Survey compile-time C++: traits, SFINAE, concepts, constexpr, and C++26 static reflection.
    What problem does each generation of tools solve?
  done: >-
    A region survey plus at least 3 proposed shrines.

- id: type-traits-from-scratch
  title: Type traits from scratch
  region: metaprogramming
  theme: "Traits & constraints"
  size: S
  prompt: >-
    Implement is_same, remove_cvref, conditional, void_t-based detection, and is_convertible
    without the standard library's traits.
  done: >-
    static_assert tests that pass against the std versions on at least 15 cases.

- id: crtp-static-poly
  title: CRTP and static polymorphism
  region: metaprogramming
  theme: "Static polymorphism"
  p: 3
  prompt: >-
    Build a CRTP mixin (e.g. comparison operators or instrumentation) and a CRTP-based strategy.
    Compare it with a virtual version in a tight loop.
  done: >-
    A benchmark plus disassembly showing the inlined CRTP path versus the indirect call.

- id: variadic-fold
  title: Variadics and folds
  region: metaprogramming
  theme: "Traits & constraints"
  prompt: >-
    Implement a minimal `tuple` with get<I>, apply and for_each using fold expressions and
    index_sequence.
  done: >-
    Tests for heterogeneous types, and an explanation of how the empty base optimisation affects its layout.

- id: concepts-constraints
  title: Concepts as contracts
  region: metaprogramming
  theme: "Traits & constraints"
  p: 3
  after: [type-traits-from-scratch]
  prompt: >-
    Write abs, gcd, lerp, clamp, mean and dot as unconstrained templates, then constrain them with
    concepts, including subsumption-based overload ordering. Rewrite one overload set in SFINAE for
    comparison.
  done: >-
    Side-by-side error messages (concepts vs SFINAE) and a working subsumption example.

- id: expression-templates
  title: Expression templates
  region: metaprogramming
  theme: "Erasure & expressions"
  p: 3
  prompt: >-
    Write a vector type whose `a + b * c` builds an expression tree and evaluates it in one fused
    loop without temporaries.
  done: >-
    A benchmark against the naive version with temporaries, and a check that the fused loop vectorizes.

- id: policy-based-design
  title: Policy-based design
  region: metaprogramming
  theme: "Static polymorphism"
  after: [crtp-static-poly]
  prompt: >-
    Design a container or allocator with pluggable policies (locking, bounds checking,
    growth) selected at compile time.
  done: >-
    Three policy combinations, with proof that the unused policies cost nothing (sizeof + asm).

- id: type-erasure
  title: Type erasure with small buffers
  region: metaprogramming
  theme: "Erasure & expressions"
  p: 3
  prompt: >-
    Implement Sean Parent-style runtime polymorphism (a `drawable`/`any_callable`) with a
    small-buffer optimisation.
  done: >-
    Allocation counts with and without SBO, and a benchmark against a virtual hierarchy.

- id: static-reflection-26
  title: Static reflection (C++26)
  region: metaprogramming
  theme: "Reflection & build cost"
  p: 4
  prompt: >-
    Using a P2996-capable compiler on Compiler Explorer (the experimental clang-p2996, or GCC
    trunk), auto-generate enum_to_string and a struct-to-JSON serializer through reflection.
  done: >-
    Both utilities work on 3+ types with no macros, and the write-up compares this with the pre-reflection hacks.

- id: compile-time-dispatch
  title: Picking kernels at compile time
  region: metaprogramming
  theme: "Static polymorphism"
  size: S
  prompt: >-
    Use if constexpr / tag dispatch to select SIMD vs scalar vs specialised paths by element type
    and alignment traits.
  done: >-
    One entry point, three paths, verified by asm for each instantiation.

- id: template-instantiation-cost
  title: What templates cost the build
  region: metaprogramming
  theme: "Reflection & build cost"
  size: S
  after: [expression-templates]
  prompt: >-
    Measure the compile time and binary size of 200 generated expressions over your expression
    templates (Expression templates shrine) under clang -ftime-trace. Reduce both with extern
    templates or type erasure.
  done: >-
    Before/after compile time and binary size, with the flame chart from -ftime-trace.

# ---- Instrument Ridge (tooling-measurement) ----------------------------------
- id: tower-tooling
  title: "Tower: Instrument Ridge"
  region: tooling-measurement
  kind: tower
  size: S
  prompt: >-
    Survey the measurement toolbox: benchmarks, profilers, sanitizers, fuzzers, and
    CPU/GPU tracing. What question does each tool answer?
  done: >-
    A region survey plus at least 3 proposed shrines.

- id: cmake-modern
  title: The shrine template
  region: tooling-measurement
  theme: "The workbench"
  p: 3
  size: S
  prompt: >-
    Build the repo's shared C++ template: target-based CMake with presets for release, asan/ubsan,
    tsan and bench, plus Google Benchmark and a test framework via FetchContent, and a Homebrew
    preset (LLVM, GCC, TBB, libomp) for Apple's gaps.
  done: >-
    `stratum start <id>` can copy this template, and all presets build a hello-benchmark.

- id: benchmark-methodology
  title: Benchmarks that don't lie
  region: tooling-measurement
  theme: "Benchmarking"
  p: 4
  after: [cmake-modern]
  prompt: >-
    Take a deliberately noisy microbenchmark and stabilise it: DoNotOptimize/ClobberMemory,
    frequency scaling, turbo, warmup, repetitions, and reporting medians and intervals.
  done: >-
    Coefficient of variation before vs after, and a checklist that you reuse for every later shrine.

- id: perf-basics
  title: perf and flame graphs
  region: tooling-measurement
  theme: "Profilers"
  requires: [linux]
  after: [order-book]
  prompt: >-
    Profile your order book (The order book shrine) replaying its synthetic stream with perf
    stat/record and produce a flame graph. Find and fix one hotspot.
  done: >-
    Flame graphs before and after, with the counter deltas (cycles, IPC, cache misses) explained.

- id: sanitizers
  title: The sanitizers
  region: tooling-measurement
  theme: "Bug hunting"
  size: S
  prompt: >-
    Plant five bugs (use-after-free, overflow, signed overflow, data race, uninitialised read) and
    catch each one with ASan/UBSan/TSan, plus MSan on the Linux server (macOS has none). Measure the
    slowdown of each sanitizer.
  done: >-
    All five caught, plus an overhead table.

- id: fuzzing
  title: Fuzz a parser
  region: tooling-measurement
  theme: "Bug hunting"
  after: [sanitizers, std-expected-errors]
  prompt: >-
    Fuzz your parser (Errors as values shrine) with libFuzzer (Homebrew LLVM on the Mac), using a
    corpus and a dictionary, until it finds a real bug, or plant one after 30 minutes.
  done: >-
    A minimised crashing input, the fix, and a coverage report.

- id: godbolt-reading
  title: Reading the compiler's mind
  region: tooling-measurement
  theme: "The workbench"
  p: 3
  size: S
  prompt: >-
    Pick 4 small functions and compare their output across -O0/-O2/-O3 and GCC vs Clang on
    Compiler Explorer. Explain every difference.
  done: >-
    Annotated asm listings with one explanation per difference.

- id: heaptrack-allocations
  title: Where the allocations go
  region: tooling-measurement
  theme: "Profilers"
  size: S
  after: [order-book]
  prompt: >-
    Profile allocations in your order book (The order book shrine) with a custom operator new hook
    (or heaptrack on the Linux server), then remove the top allocation site.
  done: >-
    Allocation counts before and after, and the latency impact.

- id: nsight-systems-intro
  title: The GPU timeline
  region: tooling-measurement
  theme: "Profilers"
  requires: [gpu]
  size: S
  prompt: >-
    Trace a training step of the pytorch/examples MNIST script with Nsight Systems. Identify kernel
    gaps, CPU launch overhead, and memcpy stalls.
  done: >-
    An annotated timeline screenshot and one optimisation that visibly closes a gap.

- id: bench-regression-ci
  title: Benchmarks in CI
  region: tooling-measurement
  theme: "Benchmarking"
  after: [benchmark-methodology]
  prompt: >-
    Run the repo's benchmarks in CI, compare them with a stored baseline, and flag statistically
    significant regressions.
  done: >-
    A deliberately planted regression makes CI fail with a readable report.

# ---- Atomic Steppes (concurrency) --------------------------------------------
- id: tower-concurrency
  title: "Tower: Atomic Steppes"
  region: concurrency
  kind: tower
  size: S
  prompt: >-
    Survey C++ concurrency: threads, the memory model, lock-free structures, safe memory reclamation,
    and std::execution. Where do the hard problems live?
  done: >-
    A region survey plus at least 3 proposed shrines.

- id: threads-and-jthread
  title: jthread and scaling
  region: concurrency
  theme: "Threads & locks"
  size: S
  prompt: >-
    Write a parallel reduction over std::jthread with stop_token cancellation. Measure scaling
    from 1 to N cores.
  done: >-
    A scaling plot, with the deviation from linear explained.

- id: mutex-contention
  title: Locks under contention
  region: concurrency
  theme: "Threads & locks"
  p: 3
  after: [threads-and-jthread]
  prompt: >-
    Implement a TAS spinlock, a TTAS spinlock with pause/backoff, and a ticket lock. Benchmark them
    against std::mutex at 1 to N threads.
  done: >-
    Throughput and fairness plots for every lock type.

- id: memory-order-litmus
  title: Litmus tests
  region: concurrency
  theme: "The memory model"
  p: 4
  requires: [x86]
  prompt: >-
    Write the store-buffering and message-passing litmus tests. Observe store-buffer reordering
    on x86, and show which memory_order fixes each one (run on ARM if available).
  done: >-
    Observed outcome counts per test and ordering, explained with the C++ memory model.

- id: spsc-ring-buffer
  title: The SPSC ring buffer
  region: concurrency
  theme: "Lock-free queues"
  p: 4
  after: [memory-order-litmus]
  prompt: >-
    Build a bounded single-producer single-consumer queue with acquire/release, cached
    head/tail indices and cache-line padding. Optimise it step by step.
  done: >-
    Throughput and latency after each optimisation, and TSan-clean tests.

- id: mpmc-queue
  title: Vyukov's MPMC queue
  region: concurrency
  theme: "Lock-free queues"
  after: [spsc-ring-buffer]
  prompt: >-
    Implement Dmitry Vyukov's bounded MPMC queue with per-slot sequence numbers.
  done: >-
    A stress test under TSan and a throughput comparison against a mutex-protected deque.

- id: false-sharing
  title: False sharing
  region: concurrency
  theme: "Threads & locks"
  p: 3
  size: S
  after: [threads-and-jthread]
  prompt: >-
    Build per-thread counters packed together, then padded with
    alignas(std::hardware_destructive_interference_size).
  done: >-
    A slowdown factor measured, and perf c2c evidence from the Linux server.

- id: work-stealing-pool
  title: A work-stealing pool
  region: concurrency
  theme: "Schedulers"
  p: 3
  size: L
  prompt: >-
    Implement a thread pool with per-worker Chase–Lev deques and random stealing. Run
    recursive fib/quicksort on it.
  done: >-
    A scaling comparison against a single-queue pool, with correctness under TSan.

- id: hazard-pointers
  title: Safe memory reclamation
  region: concurrency
  theme: "The memory model"
  after: [memory-order-litmus]
  prompt: >-
    Build a Treiber stack. Demonstrate the ABA problem and use-after-free, then fix them with hazard
    pointers (hand-rolled, or C++26 std::hazard_pointer where available).
  done: >-
    A reproducible ABA failure, then a fixed version that passes a stress test.

- id: seqlock
  title: The seqlock
  region: concurrency
  theme: "The memory model"
  size: S
  after: [memory-order-litmus]
  prompt: >-
    Implement a seqlock for a market-data snapshot with correct atomic fences, and justify
    why the reader's copy is race-free under the C++ model.
  done: >-
    A stress test that detects no torn reads, and a write-up of the fence placement.

- id: std-execution
  title: Senders and receivers
  region: concurrency
  theme: "Schedulers"
  p: 3
  prompt: >-
    Build a small async pipeline with std::execution (C++26), via NVIDIA stdexec if your
    compiler lacks it: schedule, then, when_all and a custom scheduler.
  done: >-
    The pipeline runs on a thread pool, and the write-up compares it with futures and callbacks.

# ---- Cacheline Woods (data-structures) ----------------------------------------
- id: tower-data-structures
  title: "Tower: Cacheline Woods"
  region: data-structures
  kind: tower
  size: S
  prompt: >-
    Survey data structures designed around the memory hierarchy: layouts, probing, allocation,
    and intrusive designs.
  done: >-
    A region survey plus at least 3 proposed shrines.

- id: soa-vs-aos
  title: AoS, SoA, AoSoA
  region: data-structures
  theme: "Layouts & search"
  p: 3
  size: S
  prompt: >-
    Write a particle update in AoS, SoA and AoSoA layouts, updating one field and then all fields.
  done: >-
    A benchmark matrix (layout × access pattern), with the results explained by bytes moved.

- id: open-addressing-hashmap
  title: A flat hash map
  region: data-structures
  theme: "Hash tables"
  p: 3
  prompt: >-
    Implement an open-addressing hash map with linear probing and Robin Hood displacement.
    Benchmark it against std::unordered_map.
  done: >-
    Lookup/insert/erase timings across load factors, plus a probe-length histogram.

- id: swiss-table-probe
  title: SIMD group probing
  region: data-structures
  theme: "Hash tables"
  requires: [x86]
  after: [open-addressing-hashmap]
  needs: [open-addressing-hashmap]
  prompt: >-
    Add SwissTable-style control bytes and SSE2 group matching to your hash map.
  done: >-
    A speedup over scalar probing at high load, and the control-byte states explained.

- id: arena-allocator
  title: Arenas and pmr
  region: data-structures
  theme: "Nodes & containers"
  size: S
  prompt: >-
    Write a bump/arena allocator and plug it into std::pmr (and monotonic_buffer_resource) for an
    allocation-heavy workload such as parsing into a tree.
  done: >-
    Time and allocation counts against the default allocator.

- id: eytzinger-search
  title: Eytzinger layout
  region: data-structures
  theme: "Layouts & search"
  prompt: >-
    Implement binary search over an Eytzinger (BFS) layout with prefetching, and compare it with
    std::lower_bound on a sorted array at sizes from L1 to DRAM.
  done: >-
    A plot of time vs array size, with the cache-level transitions labelled.

- id: radix-sort
  title: Radix sort
  region: data-structures
  theme: "Layouts & search"
  prompt: >-
    Write an LSD radix sort for 32/64-bit keys with histogram prefetch, and compare it with std::sort
    and pdqsort.
  done: >-
    Throughput vs N, with a bandwidth-bound analysis of the large-N regime.

- id: order-book
  title: The order book
  region: data-structures
  theme: "Nodes & containers"
  p: 4
  after: [intrusive-containers]
  prompt: >-
    Implement a price-level order book: array levels near the touch, intrusive FIFO per level,
    and O(1) cancel via an id→node map.
  done: >-
    p50/p99/p99.9 latency for add, cancel and execute on a replayed synthetic stream.

- id: bloom-filter
  title: Blocked Bloom filters
  region: data-structures
  theme: "Hash tables"
  size: S
  prompt: >-
    Implement a standard Bloom filter and a cache-line-blocked one, then measure the false-positive rate
    against theory.
  done: >-
    FPR vs bits-per-key compared with the formula, plus lookup speed.

- id: small-vector-sbo
  title: small_vector
  region: data-structures
  theme: "Nodes & containers"
  size: S
  prompt: >-
    Implement a small_vector<T, N> with inline storage that spills to the heap.
  done: >-
    Tests (including exception safety), and allocation counts when tokenising a generated 10 MB log
    into one `small_vector<string_view, 8>` per line.

- id: intrusive-containers
  title: Intrusive lists
  region: data-structures
  theme: "Nodes & containers"
  size: S
  prompt: >-
    Implement an intrusive doubly linked list (boost.intrusive style) and compare it with
    std::list<T*> and std::list<T>.
  done: >-
    Traversal and splice benchmarks, and a discussion of pointer chasing.

- id: lru-cache
  title: A cache-friendly LRU
  region: data-structures
  theme: "Hash tables"
  size: S
  after: [open-addressing-hashmap, intrusive-containers]
  needs: [open-addressing-hashmap]
  prompt: >-
    Build an LRU cache on your flat hash map with intrusive recency links, and compare it with the
    textbook unordered_map + std::list version.
  done: >-
    Hit-path latency comparison and memory footprint per entry.

# ---- Vector Coast (parallel-simd) ---------------------------------------------
- id: tower-parallel-simd
  title: "Tower: Vector Coast"
  region: parallel-simd
  kind: tower
  size: S
  prompt: >-
    Survey CPU parallelism: vectorization (auto, intrinsics, std::simd), OpenMP, and parallel
    algorithms, and how to reason about peak FLOPs on your machine.
  done: >-
    A region survey plus at least 3 proposed shrines.

- id: auto-vectorization
  title: When the compiler vectorizes
  region: parallel-simd
  theme: "Vectorization"
  p: 3
  size: S
  prompt: >-
    Write 6 loops, some that vectorize and some that don't. Read the -fopt-info-vec / -Rpass=loop-vectorize
    remarks, then fix the loops that fail.
  done: >-
    The remarks before and after, with the reason each loop failed.

- id: simd-intrinsics-dot
  title: The dot product, by hand
  region: parallel-simd
  theme: "Vectorization"
  p: 3
  requires: [x86]
  after: [auto-vectorization]
  prompt: >-
    Write an AVX2+FMA dot product with 1, 2, 4 and 8 independent accumulators, and compare it with the scalar
    and auto-vectorized versions.
  done: >-
    GFLOP/s per variant, with the plateau explained by FMA latency and throughput.

- id: std-simd
  title: Portable SIMD
  region: parallel-simd
  theme: "Vectorization"
  size: S
  requires: [x86]
  after: [simd-intrinsics-dot]
  needs: [simd-intrinsics-dot]
  prompt: >-
    Port your dot product (The dot product, by hand shrine) and one more kernel to std::simd (C++26,
    or GCC's std::experimental::simd).
  done: >-
    Performance parity (or not) with intrinsics, and asm comparison.

- id: simd-stream-compaction
  title: SIMD filtering
  region: parallel-simd
  theme: "SIMD algorithms"
  requires: [x86]
  after: [simd-intrinsics-dot]
  prompt: >-
    Filter an int array by a predicate with SIMD: a compress instruction on AVX-512, or a shuffle
    LUT on AVX2.
  done: >-
    Throughput vs selectivity, compared with a branchy scalar version and a branchless one.

- id: simd-parsing
  title: Parsing at gigabytes per second
  region: parallel-simd
  theme: "SIMD algorithms"
  p: 3
  prompt: >-
    Classify characters with SIMD (simdjson-style) to find delimiters/newlines in CSV,
    and build a structural index.
  done: >-
    GB/s throughput and comparison with a scalar splitter.

- id: openmp-basics
  title: OpenMP, carefully
  region: parallel-simd
  theme: "Multicore"
  size: S
  prompt: >-
    Parallelise an irregular loop (Mandelbrot rows, or a triangular all-pairs loop) with OpenMP.
    Compare the static, dynamic and guided schedules, and use reductions.
  done: >-
    Scaling per schedule, with the load imbalance visualised.

- id: cpu-gemm-tiling
  title: CPU GEMM, climbing
  region: parallel-simd
  theme: "Vectorization"
  p: 4
  size: L
  requires: [x86]
  after: [simd-intrinsics-dot]
  prompt: >-
    Optimise single-core SGEMM: loop order, cache blocking, packing, and an AVX2/AVX-512 register-tiled
    microkernel.
  done: >-
    GFLOP/s at each step as a percentage of theoretical peak, compared with OpenBLAS.

- id: parallel-stl
  title: Parallel algorithms
  region: parallel-simd
  theme: "Multicore"
  size: S
  prompt: >-
    Use std::execution::par / par_unseq algorithms (TBB backend: Homebrew GCC + TBB on the Mac) for
    sort, reduce and transform_reduce, and compare them with hand-rolled threads.
  done: >-
    A scaling plot and a note on when par_unseq is legal.

# ---- Kernel Jungle (gpu-programming) -----------------------------------------
- id: tower-gpu
  title: "Tower: Kernel Jungle"
  region: gpu-programming
  kind: tower
  size: S
  requires: [gpu]
  prompt: >-
    Survey the GPU programming model (grids, blocks, warps, memory spaces) and the tool
    choices: CUDA C++, Triton, CUTLASS/CuTe, PyTorch extensions.
  done: >-
    A region survey plus at least 3 proposed shrines.

- id: cuda-first-kernel
  title: The first kernel
  region: gpu-programming
  theme: "First kernels"
  p: 3
  size: S
  requires: [gpu]
  prompt: >-
    Write vector add and SAXPY in CUDA. Measure achieved bandwidth against the card's
    theoretical peak across launch configurations.
  done: >-
    A bandwidth vs launch-config table, with the best config explained.

- id: cuda-reduction
  title: The reduction ladder
  region: gpu-programming
  theme: "First kernels"
  p: 3
  requires: [gpu]
  after: [cuda-first-kernel]
  prompt: >-
    Walk the classic parallel reduction optimisation steps (Harris): divergent → sequential
    addressing → first-add-during-load → unrolling → warp shuffles.
  done: >-
    GB/s after every step, and why each one helps.

- id: cuda-transpose
  title: Transpose and shared memory
  region: gpu-programming
  theme: "First kernels"
  size: S
  requires: [gpu]
  after: [cuda-first-kernel]
  prompt: >-
    Write the matrix transpose three ways: naive, shared-memory tiled, and tiled with padding.
  done: >-
    Bandwidth for each version, and the coalescing and bank-conflict story told.

- id: cuda-scan
  title: Parallel scan
  region: gpu-programming
  theme: "First kernels"
  requires: [gpu]
  after: [cuda-reduction]
  prompt: >-
    Implement a Blelloch work-efficient scan and use it for stream compaction.
  done: >-
    Correct on non-power-of-two sizes, with throughput compared against CUB.

- id: cuda-gemm-tiled
  title: SGEMM, kernel by kernel
  region: gpu-programming
  theme: "Matmul & attention"
  p: 4
  size: L
  requires: [gpu]
  after: [cuda-transpose]
  prompt: >-
    Work the SGEMM ladder: naive → coalesced → shared-memory tiling → 1D/2D blocktiling →
    vectorised loads → warptiling, benchmarking against cuBLAS.
  done: >-
    GFLOP/s per kernel as a percentage of cuBLAS, with the limiting factor at each step identified.

- id: online-softmax
  title: Online softmax
  region: gpu-programming
  theme: "Matmul & attention"
  size: S
  requires: [gpu]
  after: [cuda-reduction]
  prompt: >-
    Implement softmax as a naive 3-pass version and as a one-pass version with the online max/normaliser trick.
  done: >-
    Numerical equivalence tests (including large logits) and a bandwidth comparison.

- id: flash-attention-mini
  title: FlashAttention, small
  region: gpu-programming
  theme: "Matmul & attention"
  p: 4
  size: L
  requires: [gpu]
  after: [online-softmax]
  prompt: >-
    Write a tiled FlashAttention forward kernel for small head dims that uses online softmax and
    never materialises the N×N matrix.
  done: >-
    Matches naive attention within tolerance, with memory use and speed compared as N grows.

- id: triton-kernels
  title: Triton
  region: gpu-programming
  theme: "Beyond CUDA C++"
  p: 3
  requires: [gpu]
  prompt: >-
    Write fused LayerNorm and fused softmax kernels in Triton, and compare them with PyTorch eager and
    torch.compile.
  done: >-
    Benchmark table, and a note on what Triton decided for you (tiling, masking).

- id: cuda-streams-overlap
  title: Streams and overlap
  region: gpu-programming
  theme: "Runtime & launch"
  size: S
  requires: [gpu]
  prompt: >-
    Overlap H2D copies, compute and D2H copies using multiple streams and pinned memory.
  done: >-
    An Nsight Systems timeline showing the overlap, and the end-to-end speedup.

- id: pytorch-cpp-extension
  title: A custom PyTorch op
  region: gpu-programming
  theme: "Beyond CUDA C++"
  p: 3
  requires: [gpu]
  after: [cuda-first-kernel]
  prompt: >-
    Package one of your CUDA kernels as a PyTorch C++/CUDA extension with autograd support.
  done: >-
    gradcheck passes, and the op is callable from Python with no copies.

- id: cuda-graphs
  title: CUDA graphs
  region: gpu-programming
  theme: "Runtime & launch"
  size: S
  requires: [gpu]
  after: [cuda-streams-overlap]
  prompt: >-
    Capture a sequence of many small kernels in a CUDA graph and measure the launch-overhead
    savings.
  done: >-
    Per-iteration time with and without graphs, as kernel count grows.

- id: cutlass-cute-intro
  title: CuTe layouts
  region: gpu-programming
  theme: "Matmul & attention"
  requires: [gpu]
  after: [cuda-transpose]
  prompt: >-
    Learn CuTe's layout algebra (shape, stride, composition, tiling) by expressing your
    transpose and a GEMM tile with it.
  done: >-
    Working kernels, and an explanation of a layout composition in your own words.

# ---- Activation Marsh (interp-engineering) -----------------------------------
- id: tower-interp-engineering
  title: "Tower: Activation Marsh"
  region: interp-engineering
  kind: tower
  size: S
  prompt: >-
    Survey the engineering of interpretability: capturing activations, storing them, training dictionaries,
    intervening, and visualising. Where are the throughput bottlenecks?
