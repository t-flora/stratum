- id: activation-patching
  title: Activation patching
  region: interp-engineering
  theme: "Probing & patching"
  p: 4
  after: [activation-hooks]
  prompt: >-
    Build a patching harness for an IOI-style task: clean/corrupted runs, patching per layer ×
    position, batched efficiently.
  done: >-
    A patching heatmap, and a harness that runs all patches in batched forward passes.

- id: attribution-patching
  title: Attribution patching
  region: interp-engineering
  theme: "Probing & patching"
  after: [activation-patching]
  needs: [activation-patching]
  prompt: >-
    Implement attribution patching (the gradient-based linear approximation) and compare it with the real patching
    results from your harness.
  done: >-
    A correlation plot against real patching, the speedup, and where the approximation breaks.

- id: toy-superposition
  title: Toy models of superposition
  region: interp-engineering
  theme: "Dictionary learning"
  p: 3
  links: [theory-superposition]
  prompt: >-
    Replicate the core toy model from Anthropic's "Toy Models of Superposition": sparse features,
    a small bottleneck, and importance weighting.
  done: >-
    A phase diagram of feature sparsity vs superposition, and a feature-geometry plot.

- id: sae-training
  title: Training an SAE
  region: interp-engineering
  theme: "Dictionary learning"
  p: 4
  size: L
  after: [activation-store, toy-superposition]
  needs: [activation-store]
  prompt: >-
    Train a ReLU + L1 sparse autoencoder on GPT-2 small residual activations from your activation
    store.
  done: >-
    L0, reconstruction MSE, fraction of loss recovered, and dead-latent counts tracked over training.

- id: topk-sae
  title: TopK SAE
  region: interp-engineering
  theme: "Dictionary learning"
  p: 3
  after: [sae-training]
  needs: [sae-training]
  prompt: >-
    Train a TopK SAE (Gao et al., 2024) with the AuxK loss and compare it with your ReLU SAE at matched L0.
  done: >-
    The sparsity–reconstruction frontier for both, and dead latents compared.

- id: sae-encoder-kernel
  title: A fused SAE encoder
  region: interp-engineering
  theme: "Dictionary learning"
  p: 3
  requires: [gpu]
  after: [topk-sae]
  prompt: >-
    Write a fused encoder (matmul + bias + top-k) and a sparse decoder that exploits k ≪ d,
    as a Triton or CUDA kernel.
  done: >-
    Speedup over dense PyTorch at several k, with a correctness check.

- id: feature-dashboard
  title: Feature dashboards
  region: interp-engineering
  theme: "Using features"
  after: [sae-training]
  needs: [sae-training]
  prompt: >-
    For each latent of your SAE (Training an SAE shrine), stream pile-10k (the corpus from The
    activation store) and keep the top-k activating contexts with a bounded heap per latent. Render
    a small HTML dashboard.
  done: >-
    Dashboards for 20 latents, with the streaming memory bound verified.

- id: steering-vectors
  title: Steering vectors
  region: interp-engineering
  theme: "Using features"
  size: S
  after: [sae-training]
  prompt: >-
    Build a contrastive steering vector (ActAdd's Love − Hate, GPT-2 small, layer 6) and SAE-feature
    steering for the same behaviour with your SAE (Training an SAE shrine), and compare the two.
  done: >-
    Generation samples at several coefficients, plus a simple quantitative effect measure.

- id: transcoders
  title: Transcoders
  region: interp-engineering
  theme: "Dictionary learning"
  after: [sae-training]
  prompt: >-
    Train a transcoder that maps an MLP's input to its output through a sparse bottleneck, and compare its
    interpretability and fidelity with an SAE on the same layer.
  done: >-
    Fidelity metrics, and 5 latents inspected in both.

- id: induction-heads
  title: Finding induction heads
  region: interp-engineering
  theme: "Probing & patching"
  size: S
  links: [theory-circuits]
  prompt: >-
    Detect induction heads in GPT-2 small using repeated random-token sequences and an induction
    score per head.
  done: >-
    A heatmap of induction scores, and an ablation showing that the top heads matter.

# ---- Tick Canyon (low-latency) ------------------------------------------------
- id: tower-low-latency
  title: "Tower: Tick Canyon"
  region: low-latency
  kind: tower
  size: S
  prompt: >-
