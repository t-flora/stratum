- id: linear-probes
  title: Probes and controls
  region: interp-engineering
  theme: "Probing & patching"
  after: [activation-hooks]
  prompt: >-
    Train linear probes on GPT-2 small for part of speech (UD English-EWT tags) at every layer, with
    Hewitt & Liang style control tasks to measure selectivity.
  done: >-
