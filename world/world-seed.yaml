  done: >-
    Write and read GB/s against the disk's peak, with the loader keeping a GPU (or CPU trainer) fed.

- id: logit-lens
  title: The logit lens
  region: interp-engineering
  theme: "Capturing activations"
  size: S
  after: [activation-hooks]
  prompt: >-
    Implement the logit lens on GPT-2: decode each layer's residual stream through the unembedding.
  done: >-
