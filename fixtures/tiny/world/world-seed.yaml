# A tiny synthetic world for tests (§14): 3 surface regions, 1 island, 1 vein.
canvas: { width: 1600, height: 1000 }
start:
  vantage: [500, 500]
  plateau: [a-one]
regions:
  - { id: west,  layer: surface, name: "West",  centroid: [500, 500] }
  - { id: east,  layer: surface, name: "East",  centroid: [1100, 500] }
  - { id: north, layer: surface, name: "North", centroid: [800, 200] }
  - { id: cloud, layer: sky,     name: "Cloud", centroid: [800, 500], radius: 150 }
  - { id: deep,  layer: depths,  name: "Deep" }
ridges:
  default: 2
  overrides:
    - { between: [west, north], h: 4 }
shrines:
  - { id: tower-west,  title: "Tower W", region: west,  kind: tower, prompt: p, done: d }
  - { id: tower-east,  title: "Tower E", region: east,  kind: tower, prompt: p, done: d }
  - { id: tower-north, title: "Tower N", region: north, kind: tower, prompt: p, done: d }
  - { id: tower-cloud, title: "Tower C", region: cloud, kind: tower, prompt: p, done: d }
  - { id: a-one,   title: "A1", region: west,  prompt: p, done: d }
  - { id: a-two,   title: "A2", region: west,  p: 3, prompt: p, done: d }
  - { id: b-one,   title: "B1", region: east,  prompt: p, done: d }
  - { id: b-two,   title: "B2", region: east,  p: 3, prompt: p, done: d, links: [sky-one] }
  - { id: c-one,   title: "C1", region: north, prompt: p, done: d }
  - { id: sky-one, title: "S1", region: cloud, prompt: p, done: d }
  - { id: deep-one, title: "D1", region: deep, below: a-one, prompt: p, done: d }
  - { id: deep-two, title: "D2", region: deep, below: a-one, prompt: p, done: d }
  - { id: temple-x, title: "T", region: east, kind: temple, needs: [b-one, b-two], prompt: p, done: d }
