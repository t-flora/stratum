# Stratum tunables. See DESIGN.md §6, §7 and §16.
world:
  seed: 20261002            # region geometry / noise seed (§8.4)

writeup:
  minWords: 250

hardware:
  available: [arm, llm-api]     # fallback only; `stratum setup` writes the real per-machine value to stratum.local.yaml

visibility:
  radiusBase: 150           # R(p) = radiusBase + radiusPerP * p
  radiusPerP: 90
  silhouetteFactor: 1.6
  peekMargin: 1             # a silhouette peeks over a ridge H only if p > H + peekMargin
  towerRadiusBonus: 300
  towerRidgeBonus: 2
  lightRadius: 220
  glowRadius: 40
  silhouetteTitleMinP: 3
  exploreRidge: 2           # terrain is explored up to the first ridge this high (docs/plans/unknown.md)

horizon:
  farDistance: 450
